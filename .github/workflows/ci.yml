name: ci

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Research logic
        run: python persona.py --selftest
      - name: Planner, metrics and state logic
        run: python anti.py selftest
      - name: Browser channels compile
        run: python -m py_compile browse.py
