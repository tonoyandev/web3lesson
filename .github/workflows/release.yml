name: release

# Builds the packaged app when a GitHub release is published and attaches it.
# Manual runs build the same files as workflow artifacts, without a release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: anti-persona-macos-apple-silicon.zip
          - os: windows-latest
            asset: anti-persona-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install pyinstaller -r requirements.txt

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name anti-persona \
            --osx-bundle-identifier io.github.antipersona --hidden-import browse app.py
          BIN=dist/anti-persona.app/Contents/MacOS/anti-persona
          export ANTI_HOME="$RUNNER_TEMP/anti-home"
          "$BIN" --selftest
          "$BIN" --script persona --selftest
          "$BIN" --script anti selftest
          ditto -c -k --keepParent dist/anti-persona.app "${{ matrix.asset }}"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --console --name anti-persona --hidden-import browse app.py
          $env:ANTI_HOME = "$env:RUNNER_TEMP\anti-home"
          $exe = "dist\anti-persona\anti-persona.exe"
          & $exe --selftest; if ($LASTEXITCODE) { exit 1 }
          & $exe --script persona --selftest; if ($LASTEXITCODE) { exit 1 }
          & $exe --script anti selftest; if ($LASTEXITCODE) { exit 1 }
          Compress-Archive -Path dist\anti-persona -DestinationPath "${{ matrix.asset }}"

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.asset }}" --clobber

      - name: Keep as a workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
