<text x="939.0" y="136.0" font-size="12" font-weight="800" fill="#4ade80" text-anchor="start" letter-spacing="1.5">STEP 4</text>
<text x="939.0" y="164.0" font-size="21" font-weight="700" fill="#fff" text-anchor="start" >Measure</text>
<text x="939.0" y="194.0" font-size="14.5" font-weight="400" fill="#9aa3b2" text-anchor="start" >Checks the path is smooth</text>
<text x="939.0" y="216.0" font-size="14.5" font-weight="400" fill="#9aa3b2" text-anchor="start" >and the change is real.</text>
