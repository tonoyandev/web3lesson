<text x="54.0" y="136.0" font-size="12" font-weight="800" fill="#7c9cff" text-anchor="start" letter-spacing="1.5">STEP 1</text>
<text x="54.0" y="164.0" font-size="21" font-weight="700" fill="#fff" text-anchor="start" >Research</text>
<text x="54.0" y="194.0" font-size="14.5" font-weight="400" fill="#9aa3b2" text-anchor="start" >Reads your history and</text>
<text x="54.0" y="216.0" font-size="14.5" font-weight="400" fill="#9aa3b2" text-anchor="start" >AI chats, all locally.</text>
