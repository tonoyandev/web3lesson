<text x="644.0" y="164.0" font-size="21" font-weight="700" fill="#fff" text-anchor="start" >Run</text>
<text x="644.0" y="194.0" font-size="14.5" font-weight="400" fill="#9aa3b2" text-anchor="start" >Lives one day at a time</text>
<text x="644.0" y="216.0" font-size="14.5" font-weight="400" fill="#9aa3b2" text-anchor="start" >in its own Chrome window.</text>
