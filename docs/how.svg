<text x="349.0" y="136.0" font-size="12" font-weight="800" fill="#47c1d4" text-anchor="start" letter-spacing="1.5">STEP 2</text>
<text x="349.0" y="164.0" font-size="21" font-weight="700" fill="#fff" text-anchor="start" >Plan</text>
<text x="349.0" y="194.0" font-size="14.5" font-weight="400" fill="#9aa3b2" text-anchor="start" >Draws a smooth path from</text>
<text x="349.0" y="216.0" font-size="14.5" font-weight="400" fill="#9aa3b2" text-anchor="start" >you to your opposite.</text>
