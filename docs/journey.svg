<title id="t">Example journey from coding to living in nature</title><desc id="d">Ten steps rising from you to your opposite: coding, a calmer desk, winding down after work, house plants, weekend walks, a balcony garden, cooking with fresh herbs, local markets, quiet mornings, living close to nature. Five days each, about seven weeks.</desc>
